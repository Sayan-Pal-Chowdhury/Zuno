<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Status</title>
  <style>html, body { background: #ffda00; }</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css?v=13">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffda00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zuno">
  <link rel="apple-touch-icon" href="zuno-icon-192.png">
  <style>
    html { background: #ffda00; }
    #zunoBootSplash { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; background: #ffda00; overflow: hidden; transition: opacity .42s ease, visibility .42s ease; }
    #zunoBootSplash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .zuno-boot-mark { display: grid; place-items: center; gap: 14px; color: #191713; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 900; text-align: center; animation: zunoBootMarkIn .62s ease both; }
    .zuno-boot-logo { width: 104px; height: 104px; border-radius: 30px; background: #fff; display: grid; place-items: center; box-shadow: 0 22px 60px rgba(25,23,19,.18); animation: zunoBootPulse 1.1s ease-in-out infinite alternate; }
    .zuno-boot-logo img { width: 84px; height: 84px; object-fit: contain; }
    .zuno-boot-name { font-size: 30px; line-height: 1; letter-spacing: 0; }
    .zuno-boot-copy { max-width: min(310px, calc(100vw - 42px)); color: rgba(25,23,19,.78); font-size: 15px; line-height: 1.35; font-weight: 800; opacity: 0; transform: translateY(12px); animation: zunoBootCopyIn .58s .58s ease forwards; }
    @keyframes zunoBootMarkIn { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes zunoBootPulse { from { transform: scale(.96); } to { transform: scale(1.04); } }
    @keyframes zunoBootCopyIn { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="zunoBootSplash" aria-label="Zuno is loading">
    <div class="zuno-boot-mark">
      <div class="zuno-boot-logo"><img src="/zuno-logo.png" alt=""></div>
      <div class="zuno-boot-name">ZUNO</div>
      <div class="zuno-boot-copy">Order from your favourite shops.</div>
    </div>
  </div>
  <div id="shop-topbar"></div>

  <main class="shop-main">
    <div class="section-head">
      <h2>Your Orders</h2>
      <a id="ordersShopLink" href="shop.html">Shop</a>
    </div>

    <section class="orders-list" id="ordersList">
      <article class="order-card skeleton-card">
        <div class="skeleton-pill"></div>
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line short"></div>
      </article>
    </section>
  </main>

  <div id="shop-navbar"></div>

  <script type="module" src="orders.js?v=3"></script>
  <script src="pwa.js?v=76" defer></script>
</body>
</html>
