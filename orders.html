<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Status</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #fff8ed; }
    body { padding-top: 96px; }
    .shop-topbar { position: fixed; inset: 0 0 auto; z-index: 50; height: 96px; background: #fff8ed; }
    .shop-main { width: min(100%, 560px); margin: 0 auto; padding: 14px; box-sizing: border-box; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css?v=22">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffda00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zuno">
  <link rel="apple-touch-icon" href="zuno-icon-192.png">
</head>
<body>
  <div id="shop-topbar">
    <header class="shop-topbar shop-topbar-skeleton" aria-label="Loading orders">
      <div class="skeleton-line medium"></div>
      <div class="skeleton-pill small"></div>
    </header>
  </div>

  <main class="shop-main">
    <div class="section-head">
      <h2>Your Orders</h2>
      <a id="ordersShopLink" href="shop.html">Shop</a>
    </div>

    <section class="orders-list" id="ordersList">
      <article class="order-card skeleton-card">
        <div class="skeleton-pill"></div>
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line short"></div>
      </article>
    </section>
  </main>

  <div id="shop-navbar"></div>

  <script type="module" src="orders.js?v=3"></script>
  <script src="pwa.js?v=80" defer></script>
</body>
</html>
