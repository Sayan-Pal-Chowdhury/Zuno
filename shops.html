<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zuno Shops</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #fff8ed; }
    body { padding-top: 96px; }
    .shop-topbar { position: fixed; inset: 0 0 auto; z-index: 50; height: 96px; background: #fff8ed; }
    .shop-main { width: min(100%, 560px); margin: 0 auto; padding: 14px; box-sizing: border-box; }
    .marketplace-hero { height: 202px; border-radius: 22px; background: linear-gradient(135deg, #ffda00, #fff1bd); }
    @media (max-width: 520px) { .marketplace-hero { height: 172px; } }
    #zunoBootSplash { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; background: #ffda00; transition: opacity .28s ease, visibility .28s ease; }
    #zunoBootSplash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .zuno-boot-mark { display: grid; place-items: center; gap: 12px; color: #191713; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 900; text-align: center; }
    .zuno-boot-logo { width: 92px; height: 92px; border-radius: 28px; background: #fff; display: grid; place-items: center; box-shadow: 0 20px 54px rgba(25,23,19,.18); }
    .zuno-boot-logo img { width: 74px; height: 74px; object-fit: contain; }
    .zuno-boot-name { font-size: 28px; line-height: 1; }
    .zuno-boot-copy { color: rgba(25,23,19,.72); font-size: 14px; font-weight: 800; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css?v=42">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffda00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zuno">
  <link rel="apple-touch-icon" href="zuno-icon-192.png">
</head>
<body>
  <div id="zunoBootSplash" aria-label="Zuno is loading">
    <div class="zuno-boot-mark">
      <div class="zuno-boot-logo"><img src="/zuno-logo.png" alt=""></div>
      <div class="zuno-boot-name">ZUNO</div>
      <div class="zuno-boot-copy">Finding shops near you</div>
    </div>
  </div>
  <div id="shop-topbar">
    <header class="shop-topbar shop-topbar-skeleton" aria-label="Loading shops">
      <div class="skeleton-line medium"></div>
      <div class="skeleton-pill small"></div>
    </header>
  </div>
  <main class="shop-main">
    <section class="marketplace-hero" id="marketplaceHero">
      <div class="marketplace-hero-track" id="marketplaceHeroTrack">
        <article class="marketplace-hero-slide">
          <div class="marketplace-hero-copy">
            <small>Available near you</small>
            <h1>Shop from local stores</h1>
            <p>Fresh stock, live availability, simple ordering.</p>
            <div class="public-login-actions">
              <a class="public-login-btn primary" href="login.html">Vendor Login</a>
              <a class="public-login-btn" href="customer-login.html">Customer Login</a>
            </div>
          </div>
          <div class="marketplace-delivery-art" aria-hidden="true">
            <span class="delivery-shop">Z</span>
            <span class="delivery-path"></span>
            <span class="delivery-rider"><i></i></span>
            <span class="delivery-bag"></span>
          </div>
        </article>
      </div>
      <div class="marketplace-hero-dots" id="marketplaceHeroDots"></div>
    </section>

    <div class="toolbar shops-search-toolbar">
      <input class="search-input" id="shopSearch" type="search" placeholder="Search shops..." oninput="filterShops()" onsearch="filterShops()">
    </div>

    <div id="browseFilters">
      <div class="section-head category-head">
        <h2>Explore local</h2>
        <button class="section-link" type="button" onclick="setMarketplaceCategory('all', this)">All</button>
      </div>

      <div class="category-row marketplace-category-row" id="marketplaceCategoryRow"></div>

      <div class="section-head category-head">
        <h2>Shop types nearby</h2>
        <span id="typeCount">All</span>
      </div>

      <div class="shop-type-scroll" id="businessTypeRow"></div>
    </div>

    <div class="section-head">
      <h2 id="shopsHeading">Open Shops</h2>
      <span id="shopCount">Loading</span>
    </div>

    <section class="shops-grid" id="shopsGrid">
      <article class="shop-card skeleton-shop-card">
        <div class="skeleton-row">
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill small"></div>
        </div>
        <div>
          <div class="skeleton-line wide"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line short"></div>
        </div>
      </article>
      <article class="shop-card skeleton-shop-card">
        <div class="skeleton-row">
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill small"></div>
        </div>
        <div>
          <div class="skeleton-line wide"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line short"></div>
        </div>
      </article>
    </section>
  </main>

  <script type="module" src="shops.js?v=35"></script>
  <script src="pwa.js?v=79" defer></script>
</body>
</html>
