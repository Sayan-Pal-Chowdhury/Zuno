<!DOCTYPE html>
<html lang="en" style="background:#ffda00;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #ffda00; }
    body.zuno-app-ready { background: #fff8ed; }
    body { padding-top: 96px; }
    .shop-topbar { position: fixed; inset: 0 0 auto; z-index: 50; height: 96px; background: #fff8ed; }
    .shop-main { width: min(100%, 560px); margin: 0 auto; padding: 14px; box-sizing: border-box; }
    .hero-card { min-height: 186px; border-radius: 30px; background: linear-gradient(135deg, #171512, #56391f); }
    #zunoBootSplash { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; background: #ffda00; transition: opacity .28s ease, visibility .28s ease; }
    #zunoBootSplash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .zuno-boot-mark { display: grid; place-items: center; gap: 12px; color: #191713; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 900; text-align: center; }
    .zuno-boot-logo { width: 92px; height: 92px; border-radius: 28px; background: #fff; display: grid; place-items: center; box-shadow: 0 20px 54px rgba(25,23,19,.18); animation: zunoBootPulse .9s ease-in-out infinite alternate; }
    .zuno-boot-logo img { width: 74px; height: 74px; object-fit: contain; }
    .zuno-boot-name { font-size: 28px; line-height: 1; }
    .zuno-boot-copy { color: rgba(25,23,19,.72); font-size: 14px; font-weight: 800; animation: zunoBootCopy .9s ease-in-out infinite alternate; }
    @keyframes zunoBootPulse { from { transform: scale(.96); } to { transform: scale(1.035); } }
    @keyframes zunoBootCopy { from { opacity: .62; } to { opacity: 1; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css?v=42">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffda00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zuno">
  <link rel="apple-touch-icon" href="zuno-icon-192.png">
</head>
<body>
  <div id="zunoBootSplash" aria-label="Zuno is loading">
    <div class="zuno-boot-mark">
      <div class="zuno-boot-logo"><img src="/zuno-logo.png" alt=""></div>
      <div class="zuno-boot-name">ZUNO</div>
      <div class="zuno-boot-copy">Opening shop</div>
    </div>
  </div>
  <div id="shop-topbar">
    <header class="shop-topbar shop-topbar-skeleton" aria-label="Loading shop">
      <div class="skeleton-line medium"></div>
      <div class="skeleton-pill small"></div>
    </header>
  </div>

  <main class="shop-main">
    <a class="all-shops-return" href="shops.html">All shops</a>
    <section class="hero-card">
      <div class="hero-copy">
        <small>Today's picks</small>
        <h1 id="heroTitle">Fresh from the market</h1>
        <p id="heroSub">Loading shop...</p>
        <div class="shop-status-row" id="shopStatusRow"></div>
      </div>
      <div class="hero-market-stack" aria-hidden="true">
        <span>Fresh</span>
        <b>Local</b>
      </div>
    </section>

    <div class="toolbar">
      <input class="search-input" id="searchInput" type="search" list="shopProductSuggestions" placeholder="Search products..." oninput="filterProducts()">
      <datalist id="shopProductSuggestions"></datalist>
      <button class="filter-button" type="button" aria-label="Filter">Filter</button>
    </div>

    <div class="quick-strip">
      <div class="quick-card" id="fulfillmentCard"><span class="quick-icon" id="fulfillmentIcon" aria-hidden="true"></span><div><strong id="fulfillmentTitle">Express</strong><span id="fulfillmentSub">Fast pickup</span></div></div>
      <div class="quick-card" id="stockQuickCard"><span class="quick-icon" id="stockIcon" aria-hidden="true"></span><div><strong>Live stock</strong><span>Updated now</span></div></div>
      <div class="quick-card" id="paymentQuickCard"><span class="quick-icon" id="paymentIcon" aria-hidden="true"></span><div><strong>COD</strong><span>Pay later</span></div></div>
    </div>

    <div class="section-head category-head" id="typeSectionHeading">
      <h2>Shop by type</h2>
      <button class="section-link" type="button" onclick="setTypeFilter('all', this)">All</button>
    </div>

    <div class="category-row" id="typeRow">
      <button class="category-chip active" onclick="setTypeFilter('all', this)">
        <span class="category-image category-all">All</span>
        All
      </button>
    </div>

    <section class="weekly-menu-section" id="weeklyMenuSection" hidden>
      <div class="section-head">
        <h2>Weekly Menu</h2>
        <button class="section-link" id="weeklyMenuToggle" type="button" onclick="toggleWeeklyMenu()">View schedule</button>
      </div>
      <div class="weekly-menu-content" id="weeklyMenuContent" hidden></div>
    </section>

    <div class="section-head">
      <h2 id="productsHeading">Shop by items</h2>
    </div>

    <section id="foodSpecialsSection" hidden>
      <div class="section-head">
        <h2>Today's specials</h2>
      </div>
      <div class="products-grid" id="foodSpecialsGrid"></div>
    </section>

    <section class="products-grid" id="productsGrid">
      <article class="product-card skeleton-card">
        <div class="product-art skeleton-block"></div>
        <div class="product-body">
          <div class="skeleton-line wide"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-button"></div>
        </div>
      </article>
      <article class="product-card skeleton-card">
        <div class="product-art skeleton-block"></div>
        <div class="product-body">
          <div class="skeleton-line wide"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-button"></div>
        </div>
      </article>
      <article class="product-card skeleton-card">
        <div class="product-art skeleton-block"></div>
        <div class="product-body">
          <div class="skeleton-line wide"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-button"></div>
        </div>
      </article>
    </section>
  </main>

  <div id="shop-navbar"></div>

  <script type="module" src="shop.js?v=3"></script>
  <script src="pwa.js?v=81" defer></script>
</body>
</html>
